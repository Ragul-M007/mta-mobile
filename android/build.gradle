allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && androidExt.hasProperty('namespace')) {
            def hasNamespace = androidExt.namespace != null && androidExt.namespace.toString().trim()
            if (!hasNamespace) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestPackage = new groovy.xml.XmlSlurper().parse(manifestFile).'@package'.text()
                    if (manifestPackage) {
                        androidExt.namespace = manifestPackage
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects { subproject ->
    subproject.buildDir = "${rootProject.buildDir}/${subproject.name}"

    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library')) {
            subproject.android {
                compileSdk = 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        if (subproject.plugins.hasPlugin('com.android.application')) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

